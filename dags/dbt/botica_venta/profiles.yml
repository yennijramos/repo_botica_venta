botica_venta:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD') }}"
      role: ROLE_BOTICAVENTA
      database: BOTICAVENTA_DB
      warehouse: WH_BOTICAVENTA
      schema: STAGING
      threads: 4
